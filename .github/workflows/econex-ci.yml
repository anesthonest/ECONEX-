# ECONEX V25.0 — Continental Infrastructure CI/CD Pipeline
# Developed under VINEXSAH TECHNOLOGIES. All rights reserved.

name: ECONEX V25 CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: econex-v25-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Typecheck, Secret Scan, Build & V25 Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ECONEX_ENV: AUTOMATED_TESTING
      PORT: "3000"
      DISABLE_HMR: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run secret & credential scan
        run: npm run security:scan

      - name: Build production bundle
        run: npm run build

      - name: Start server & run V25 live integration suite
        run: |
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/ready >/dev/null
          npm run test:v25
          kill $SERVER_PID || true

      - name: Verify secret-free source ZIP export
        run: npm run export:zip && npm run export:check
