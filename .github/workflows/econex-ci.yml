# ECONEX V31.0 — Sovereign Infrastructure, Connectivity & Continental Deployment CI/CD Pipeline
# Developed under VINEXSAH TECHNOLOGIES. All rights reserved.

name: ECONEX V31 CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: econex-v31-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Typecheck, Secret Scan, Schema 28 DDL Audit, Build & V31 Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ECONEX_ENV: AUTOMATED_TESTING
      PORT: "3000"
      DISABLE_HMR: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Schema 28 PostgreSQL 16 DDL presence
        run: |
          test -f database/schema_v28.sql
          test -f src/server/postgres/schema_v28.sql
          diff -u database/schema_v28.sql src/server/postgres/schema_v28.sql

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run secret & credential scan
        run: npm run security:scan

      - name: Build production bundle
        run: npm run build

      - name: Start server & run V31 live verification suite
        run: |
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/ready | grep -q '"schema28IntegrityValid":true'
          npm run test:v31
          kill $SERVER_PID || true

      - name: Verify secret-free V31 source ZIP export
        run: npm run export:zip && npm run export:check
